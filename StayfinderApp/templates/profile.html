{% extends 'base.html' %}

{% block content %}
<!-- Profile Display Form -->
<div class="card my-4 mx-auto" style="max-width: 700px;">
    <div class="card border-0 rounded-3 shadow-lg">
        <div class="card-header text-center bg-gradient-to-r from-teal-400 via-green-500 to-blue-600 text-white py-4 rounded-t-3">
            <h2 class="fw-bold text-uppercase text-black text-shadow-lg">Your Profile</h2>
        </div>
        
        <!-- Profile Image -->
        <div class="row mb-4">
            <div class="col-12 text-center">
                <div class="profile-image-container mb-3">
                    <img src="https://www.gstatic.com/images/icons/material/system/1x/account_circle_black_48dp.png" 
                         alt="Profile Image" class="img-fluid rounded-circle shadow-sm border-4 border-white" 
                         style="width: 100px; height: 100px; object-fit: cover;">
                </div>
            </div>
        </div>

        <div class="card-body bg-light p-3">
            <form id="profile" action="/profile/" method="post" class="needs-validation" novalidate>
                {% csrf_token %}
                <div class="container">
                    <!-- Name -->
                    <div class="mb-4">
                        <label for="full_name" class="form-label fw-semibold text-muted">Full Name:</label>
                        <div class="position-relative">
                            <input type="text" name="full_name" class="form-control form-control-lg bg-light border-2 border-gray-300 shadow-sm rounded-3 px-4 py-3 transition-all duration-300 focus:bg-white focus:border-indigo-600 focus:ring-2 focus:ring-indigo-600"
                                   id="full_name" value="{{ full_name }}" readonly>
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="mb-4">
                        <label for="email" class="form-label fw-semibold text-muted">Email Address:</label>
                        <input type="email" name="email" class="form-control form-control-lg bg-light border-2 border-gray-300 shadow-sm rounded-3 px-4 py-3 transition-all duration-300 focus:bg-white focus:border-indigo-600 focus:ring-2 focus:ring-indigo-600"
                               id="email" value="{{ email }}" readonly>
                    </div>

                    <!-- Phone -->
                    <div class="mb-4">
                        <label for="phone" class="form-label fw-semibold text-muted">Phone Number:</label>
                        <input type="tel" name="phone" class="form-control form-control-lg bg-light border-2 border-gray-300 shadow-sm rounded-3 px-4 py-3 transition-all duration-300 focus:bg-white focus:border-indigo-600 focus:ring-2 focus:ring-indigo-600"
                               id="phone" value="{{ phone }}" readonly>
                    </div>

                    <!-- Address -->
                    <div class="mb-4">
                        <label for="address" class="form-label fw-semibold text-muted">Home Address:</label>
                        <input type="text" name="address" class="form-control form-control-lg bg-light border-2 border-gray-300 shadow-sm rounded-3 px-4 py-3 transition-all duration-300 focus:bg-white focus:border-indigo-600 focus:ring-2 focus:ring-indigo-600"
                               id="address" value="{{ address }}" readonly>
                    </div>

                    <!-- Role -->
                    <div class="mb-4">
                        <label for="role" class="form-label fw-semibold text-muted">Your Role:</label>
                        <input type="text" name="role" class="form-control form-control-lg bg-light border-2 border-gray-300 shadow-sm rounded-3 px-4 py-3 transition-all duration-300 focus:bg-white focus:border-indigo-600 focus:ring-2 focus:ring-indigo-600"
                               id="role" value="{{ role }}" readonly>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>


{% endblock %}
