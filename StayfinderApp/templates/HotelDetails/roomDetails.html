{% extends 'base.html' %}

{% block content %}

{%  block css %}
<style>
    body {
        font-family: Arial, sans-serif;
    }
    form {
        max-width: 300px;
        margin: 20px auto;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        background-color: #f9f9f9;
    }
    label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
    }
    input[type="date"] {
        width: 100%;
        padding: 8px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 3px;
    }
    button {
        display: block;
        width: 100%;
        padding: 10px;
        background-color: #007BFF;
        color: white;
        border: none;
        border-radius: 3px;
        font-size: 16px;
        cursor: pointer;
    }
    button:hover {
        background-color: #0056b3;
    }
</style>
    
{% endblock  %}

    <h2 class="text-center mt-3 mb-5" >Room No. {{room_List.room_number }}</h2>


<section title="Hotel Details">
    <div class="container">
        <div class="row">
            <!-- Carousel Section -->
            <div class="col-lg-6">
                <div id="roomCarousel" class="carousel slide" data-bs-ride="carousel">
                    <div class="carousel-inner rounded-1">
                        <!-- First image -->
                        <div class="carousel-item active">
                            <img src="{{room_List.room_image1.url}}" class="d-block w-100" alt="Room Image 1" style="height: 400px; object-fit: cover;">
                        </div>
                        <!-- Second image -->
                        <div class="carousel-item">
                            <img src="{{room_List.room_image2.url}}" class="d-block w-100" alt="Room Image 2" style="height: 400px; object-fit: cover;">
                        </div>
                        <!-- Third image -->
                        <div class="carousel-item">
                            <img src="{{room_List.room_image3.url}}" class="d-block w-100" alt="Room Image 3" style="height: 400px; object-fit: cover;">
                        </div>
                    </div>
                    <!-- Carousel controls (previous and next) -->
                    <button class="carousel-control-prev" type="button" data-bs-target="#roomCarousel" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#roomCarousel" data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>
                </div>
            </div>
    
            <!-- Room Details Section -->
            <div class="col-lg-6">
                <div class="room-details">
                    <p class="text-left"><strong>Capacity:</strong> {{room_List.capacity}}</p>
                    <p class="text-left"><strong>Price:</strong> ₹{{room_List.price}}/-</p>
                    <p class="text-left"><strong>Description:</strong> {{room_List.description}}</p>

                    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#staticBackdrop">
                        Book Now
                      </button>
                    <!-- <button class="btn btn-outline-primary mt-5">Book Now</button> -->
                </div>
            </div>
        </div>
    </div>

</section>
<!-- Button trigger modal -->

  
  <!-- Modal -->
  <div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="staticBackdropLabel">Modal title</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <form action="/booking/" method="post">

                {% csrf_token %} 
                
                <input type="text" id="room_id" value="{{room_List.id}}" name="room_id" style="visibility: hidden;">
                <label for="start-date">Start Date:</label>
                <input type="date" id="start-date" name="start_date" required>
                
                <label for="end-date">End Date:</label>
                <input type="date" id="end-date" name="end_date" required>
                
                <button type="submit">Submit</button>
            </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary">Understood</button>
        </div>
      </div>
    </div>
  </div>
  <script>
    // Disable past dates
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('start-date').setAttribute('min', today);
    document.getElementById('end-date').setAttribute('min', today);
</script>

{% endblock %}
