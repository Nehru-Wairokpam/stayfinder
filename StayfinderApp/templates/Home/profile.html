{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg rounded-4">
                <div class="card-header text-center" style="background: linear-gradient(135deg, #438682, #7ebdba); color: white;">
                    <h4 class="mb-0">Profile</h4>
                </div>
                <div class="card-body">
                    <form action="{% url 'profile_update' %}" method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="fullName" class="form-label">Full Name</label>
                            <input 
                                type="text" 
                                class="form-control" 
                                id="fullName" 
                                name="fullName" 
                                value="{{ request.user.get_full_name }}" 
                                placeholder="Enter your full name" 
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input 
                                type="email" 
                                class="form-control" 
                                id="email" 
                                name="email" 
                                value="{{ request.user.email }}" 
                                placeholder="Enter your email" 
                                required>
                        </div>


                        <div class="mb-3">
                            <label for="phone" class="form-label">Phone Number</label>
                            <input 
                                type="tel" 
                                class="form-control" 
                                id="phone" 
                                name="phone" 
                                value="{{ profile.phone }}" 
                                placeholder="Enter your phone number" 
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="address" class="form-label">Address</label>
                            <input 
                                type="text" 
                                class="form-control" 
                                id="address" 
                                name="address" 
                                value="{{ profile.address }}" 
                                placeholder="Enter your full address" 
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="role" class="form-label">Select User Type</label>
                            <select id="role" name="role" class="form-control" required>
                                {% for role in roles %}
                                    <option value="{{ role.id }}" {% if role.id == profile.role.id %}selected{% endif %}>
                                        {{ role.role_name }}
                                    </option>


                                {% endfor %}
                            </select>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-lg" style="background-color: #438682; color: white;">Update Profile</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
